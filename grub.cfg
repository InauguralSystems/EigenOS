set timeout=0
set default=0

# M9.5: the kernel's Multiboot2 header requests a 1024x768x32 linear
# framebuffer (optional flag — GRUB boots us either way). all_video
# pulls in the VBE/GOP drivers so GRUB can actually set the mode; if it
# can't, the kernel falls back to the 0xB8000 text console on its own.
insmod all_video

menuentry "EigenOS" {
    multiboot2 /boot/EigenOS.elf
    boot
}
